[defaults]
inventory = inventory/hosts.yml
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
roles_path = roles

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ProxyCommand="gcloud compute start-iap-tunnel %h %p --listen-on-stdin --zone=us-west1-a --project=eng-dev-sbx--stream-1"
