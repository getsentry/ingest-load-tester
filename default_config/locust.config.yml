# Config file for the load tester

relay:
  host: http://127.0.0.1
  port: 3000
kafka:
  broker:
    bootstrap.servers: "127.0.0.1:9092"
  topics:
    outcomes: outcomes
    events: ingest-events
    transactions: ingest-transactions
    attachments: ingest-attachments
    sessions: ingest-sessions

# Organizations define which orgs to generate load for.
# Each org references user task names from http.test.yml.
# At least one organization is required.
organizations:
  - slug: sentry
    # org_id: 1
    weight: 1
    # relay_host: https://o123.ingest.us.sentry.io
    auth_token_env_var: SENTRY_AUTH_TOKEN
    api_host: https://us.sentry.io
    projects:
      - slug: my-project
    user_tasks:
      - TransactionEvents

metrics:
  enabled: true

  influxdb:
    url: "http://localhost:8086"
    # TODO replace with some valid API token
    token: "48NlqRlitvNL1k322be_mPHru-qqjcmqjPLqOzOeVJwwep8bnpne2hOu6-NUY_FmxHKcU786QCUrEy0rFxPXFA=="
    # or set the token in an env variable
    # token: "${INFLUX_DB_API_TOKEN}"
    org: "sentry"
    bucket: "locust"

  default_tags:
