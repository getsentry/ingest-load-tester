apiVersion: v1
kind: ConfigMap
metadata:
  name: locust-config
  namespace: load-test
data:
  locust.config.yml: |
    # Config file for the load tester
    relay:
      host: http://127.0.0.1
      port: 3000
    kafka:
      broker:
        bootstrap.servers: "127.0.0.1:9092"
      topics:
        outcomes: outcomes
        events: ingest-events
        transactions: ingest-transactions
        attachments: ingest-attachments
        sessions: ingest-sessions

    # Organizations define which orgs to generate load for; at least one org is required
    # user_tasks references user task names from http.test.yml
    organizations:
      - slug: sentry
        # org_id is only used for ingest tasks to build the DSN. If omitted, it is
        # inferred from relay_host (e.g. o123.ingest.us.sentry.io → 123)
        # org_id: 1
        weight: 1
        # relay_host is only used for ingest tasks that send events to Relay.
        # relay_host: https://o123.ingest.us.sentry.io
        auth_token_env_var: SENTRY_AUTH_TOKEN
        api_host: http://localhost:8000
        projects:
          - slug: test
        # Each user_task entry specifies a task name and its weight for this org.
        # Weight controls how many Locust users are spawned for this task relative to other tasks
        user_tasks:
          - name: TransactionEvents
            weight: 1

  http.test.yml: |
    users:
      SimpleLoadTest:
        wait_time: constant(1)
        num_projects: 10
        tasks:
          file_event_task_factory:
            weight: 0
            filename: test-events/small.json

          file_envelope_event_task_factory:
            weight: 0
            filename: path/to/custom/file.json

          session_event_task_factory:
            weight: 0
            started_range: 2m
            duration_range: 1m
            num_releases: 1
            num_environments: 1
            num_users: 1000
            ok_weight: 2
            exited_weight: 10
            errored_weight: 1
            crashed_weight: 1
            abnormal_weight: 1

      TransactionEvents:
        wait_time: constant(0.5)
        num_projects: 10
        tasks:
          transaction_event_task_factory:
            weight: 1
            num_releases: 10
            max_users: 10
            min_spans: 2
            max_spans: 20
            transaction_duration_max: 10m
            transaction_duration_min: 10ms
            transaction_timestamp_spread: 4h
            min_breadcrumbs: 0
            max_breadcrumbs: 50
            breadcrumb_categories: ~
            breadcrumb_levels: ~
            breadcrumb_types: ~
            breadcrumb_messages: ~
            measurements:
              - fp
              - fcp
              - lcp
              - fid
              - cls
              - ttfb
              - ttfb.requesttime
              - app_start_cold
              - app_start_warm
              - frames_total
              - frames_slow
              - frames_frozen
              - frames_slow_rate
              - frames_frozen_rate
              - stall_count
              - stall_total_time
              - stall_longest_time
              - stall_percentage
            operations:
              - browser
              - http
              - db
              - resource.script
              - resource.link
              - resource.css
              - resource.img
              - resource.other

      RandomEvents:
        wait_time: constant(1)
        num_projects: 10
        tasks:
          random_envelope_event_task_factory:
            weight: 1
            trace_user_id: "user"
            trace_user_segment: ["vip", "paid", "free"]
            trace_environment: ["debug", "prod"]
            release: ["sampling@1.0", "sampling@2.0"]
            with_level: true
            num_event_groups: 1
            num_releases: 10
            with_javascript_stacktrace: false
            num_stacktraces: 5
            min_frames: 5
            max_frames: 30

          random_event_task_factory:
            weight: 1
            with_level: true
            num_event_groups: 10
            max_users: ~
            min_breadcrumbs: 0
            max_breadcrumbs: 50
            breadcrumb_categories: ~
            breadcrumb_levels: ~
            breadcrumb_types: ~
            breadcrumb_messages: ~
            with_native_stacktrace: false
            with_javascript_stacktrace: false
            num_stacktraces: 5
            min_frames: 5
            max_frames: 30
            num_releases: 10
            release: ~

      OrganizationGroupIndex:
        wait_time: constant(1)
        tasks:
          organization_group_index_task_factory:
            stats_periods: ["90d", "24h", "12h", "1h"]
            limits: [25, 50, 100]
            sort_options: ["date", "freq", "new", "trends"]
            queries: ["is:unresolved", ""]

      OrganizationEvents:
        wait_time: constant(1)
        tasks:
          organization_events_task_factory:
            stats_periods: ["90d", "24h", "12h", "1h"]
            per_page_values: [10, 25, 50]
            field_sets:
              - ["title", "event.type", "project", "user.display", "timestamp"]
              - ["title", "count()", "project"]
            datasets: ["discover", "errors"]
            queries: ["", "event.type:error"]
            sort_by: ["-timestamp", "-count()"]

      GroupDetails:
        wait_time: constant(1)
        tasks:
          group_details_task_factory:
            fetch_limit: 100
            detail_weight: 7
            latest_event_weight: 3

      OrganizationEventsStats:
        wait_time: constant(1)
        tasks:
          organization_events_stats_task_factory:
            stats_periods: ["90d", "24h", "12h", "1h"]
            y_axes:
              - ["count()"]
              - ["count()", "count_unique(user)"]
              - ["p50(transaction.duration)", "p95(transaction.duration)"]
            intervals: ["1h", "30m", "5m"]
            queries: ["", "event.type:error"]
            datasets: ["discover", "errors"]

      GroupEventDetails:
        wait_time: constant(1)
        tasks:
          group_event_details_task_factory:
            fetch_limit: 100
            event_id_types: ["latest", "oldest", "recommended"]

      OrganizationTags:
        wait_time: constant(1)
        tasks:
          organization_tags_task_factory:
            stats_periods: ["90d", "24h", "12h", "1h"]
            datasets: ["events", "discover"]

      GroupEvents:
        wait_time: constant(1)
        tasks:
          group_events_task_factory:
            fetch_limit: 100
            full_options: [true, false]
            stats_periods: ["90d", "24h", "12h", "1h"]
            per_page_values: [10, 25, 50]

      OrganizationReleases:
        wait_time: constant(1)
        tasks:
          organization_releases_task_factory:
            per_page_values: [10, 25, 50]
            sort_options: ["date", "sessions", "crash_free_users"]
            queries: [""]
            health_stat_options: ["sessions", ""]
            summary_stats_periods: ["24h", "48h", "7d", "14d"]

      ProjectGroupIndex:
        wait_time: constant(1)
        tasks:
          project_group_index_task_factory:
            stats_periods: ["24h", "14d"]
            limits: [25, 50, 100]
            sort_options: ["date", "new"]
            queries: ["is:unresolved", ""]

      OrganizationGroupIndexStats:
        wait_time: constant(1)
        tasks:
          organization_group_index_stats_task_factory:
            fetch_limit: 100
            batch_size: 25
            stats_periods: ["90d", "24h", "12h", "1h"]
            group_stats_periods: ["24h", "14d", "auto"]
            queries: ["is:unresolved", ""]
